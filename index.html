<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Gyro Fingerprint Test</title>
</head>
<body>
    <h1>Gyro Sensor Tracking...</h1>
    
    <button id="start_btn" style="font-size:22px; padding:15px 30px; background-color:#0070f3; color:white; border:none; border-radius:5px; cursor:pointer; margin-bottom:20px;">
        ① ここをタップしてセンサーを起動
    </button>
    
    <p id="status">ボタンを押すとセンサー収集を開始します...</p>

    <script>
        // ★あなたの最新のngrokの住所をセットしました★
        const SERVER_URL = "https://ngrok-free.dev"; 

        // センサーを動かしてパソコンへ送信する本番の仕組み
        function initSensor() {
            window.addEventListener("deviceorientation", (event) => {
                const data = {
                    alpha: event.alpha ? event.alpha.toFixed(2) : 0,
                    beta: event.beta ? event.beta.toFixed(2) : 0,
                    gamma: event.gamma ? event.gamma.toFixed(2) : 0
                };

                document.getElementById("status").innerText = `傾き: X=${data.beta}, Y=${data.gamma}`;

                fetch(SERVER_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                }).catch(err => console.log("送信エラー:", err));
            }, true);
            
            document.getElementById("start_btn").style.display = "none";
        }

        document.getElementById("start_btn").addEventListener("click", () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            initSensor();
                        } else {
                            alert("スマホの設定でセンサーが拒否されました。");
                        }
                    })
                    .catch(console.error);
            } else {
                initSensor();
            }
        });
    </script>
</body>
</html>
