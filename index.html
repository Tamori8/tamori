<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyro Tracking System</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f0f2f5;">

    <h1>ジャイロデータ解析テスト</h1>
    
    <!-- スマホの防衛機能を突破する専用ボタン -->
    <button id="start_btn" style="font-size: 20px; padding: 15px 30px; background-color: #0070f3; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        ① ここをタップしてセンサーを起動
    </button>
    
    <p id="status" style="font-size: 18px; color: #555; margin-top: 20px;">ボタンを押すと計測を開始します</p>

    <script>
        // 【理屈の解説】
        // スマホから見た送り先の住所を、固定の「/api/gyro」という場所に設定します。
        // これにより、ややこしい ngrok の個別URLをここに書き込む必要が一切なくなります！
        const SERVER_URL = "/api/gyro"; 

        function initSensor() {
            window.addEventListener("deviceorientation", (event) => {
                const data = {
                    alpha: event.alpha ? event.alpha.toFixed(2) : "0.00",
                    beta: event.beta ? event.beta.toFixed(2) : "0.00",
                    gamma: event.gamma ? event.gamma.toFixed(2) : "0.00"
                };

                document.getElementById("status").innerText = `送信中... X: ${data.beta}, Y: ${data.gamma}`;

                // Vercel自身に向けてデータを送信（CORSエラーを100%回避）
                fetch(SERVER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                }).catch(err => {
                    document.getElementById("status").innerText = "送信エラー発生";
                });
            }, true);
            
            document.getElementById("start_btn").style.display = "none";
        }

        // 厳格なスマホセキュリティを解除する仕組み
        document.getElementById("start_btn").addEventListener("click", () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            initSensor();
                        } else {
                            alert("センサーへのアクセスが拒否されました。設定を確認してください。");
                        }
                    })
                    .catch(err => alert("エラー: " + err));
            } else {
                initSensor(); // AndroidやPCの場合
            }
        });
    </script>
</body>
</html>
